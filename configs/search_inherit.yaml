# Full search, weight inheritance ON (A100). Pair with search_scratch.yaml: only `inheritance` and
# `run_name` differ, everything else (seed, budget, lambdas) must stay identical.
run_name: search_inherit_seed0
output_dir: results
inheritance: true
device: auto
evolution:
  population_size: 20
  generations: 15
  tournament_size: 3
  elite_fraction: 0.1
  crossover_rate: 0.5
  mutation_rate: 0.8
  seed: 0
training:
  epochs: 3
  max_train_samples: 20000
  max_val_samples: 5000
  data_dir: ./data
  gpu_data: true
  amp: false
fitness:
  lambda_params: 0.1
  lambda_latency: 0.1
  param_reference: 2000000
  latency_reference: 0.05
